<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f0c29,#302b63,#ff2e63);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:20px;
    width:320px;
    box-shadow:0 0 20px #ff2e63;
    color:white;
}

h2{
    text-align:center;
    color:#ff2e63;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    background:#ff2e63;
    border:none;
    color:white;
    border-radius:10px;
    font-weight:bold;
}

button:hover{
    background:#ff477e;
}
</style>

</head>

<body>

<div class="box">
    <h2>📝 Join Us</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

</div>

</body>
</html>
